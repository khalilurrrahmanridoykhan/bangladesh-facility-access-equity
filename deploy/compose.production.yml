services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: shasthopath:production
    container_name: shasthopath-app
    restart: unless-stopped
    env_file:
      - ../.env.production
    volumes:
      - ../data/reports:/app/data/reports
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      onehealth:
        aliases:
          - shasthopath

networks:
  onehealth:
    external: true
    name: onehealth-platform_default
